name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri App
        run: bun tauri build

      - name: Create Tarball (Linux)
        run: |
          cd src-tauri/target/release
          tar -czvf ../../../lowcast-linux-x64.tar.gz lowcast

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lowcast-linux-x64
          path: lowcast-linux-x64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri App
        run: bun tauri build

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lowcast-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: lowcast-linux-x64

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: lowcast-windows-x64
          path: windows-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lowcast-linux-x64.tar.gz
            windows-assets/*.exe
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build' }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}

